name: Build Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # 允许在 GitHub 网页/手机 App 上一键手动触发
  workflow_dispatch:

jobs:
  build:
    # 固定 24.04：ubuntu-latest 会在 2026 年 10 月起迁到 26.04，可能带来环境变化
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Fix gradlew
        # 关键点：通过 GitHub Contents API 上传的文件一律是 644，没有可执行权限，
        # 直接 ./gradlew 会报 126（Permission denied）。
        # 这里除了 chmod，还统一用 `bash ./gradlew` 调用——bash 读脚本执行，
        # 根本不依赖可执行位，双保险。
        run: |
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew
          ls -l gradlew
          unzip -l gradle/wrapper/gradle-wrapper.jar | tail -3

      - name: Diagnose
        run: |
          echo "== Java =="; java -version 2>&1
          echo "== 版本配置 =="; cat gradle.properties
          echo "== wrapper 版本 =="; cat gradle/wrapper/gradle-wrapper.properties

      - name: Build
        id: gradle
        run: |
          set -o pipefail
          bash ./gradlew build --stacktrace 2>&1 | tee build.log

      # 失败时把最关键几行直接打在日志末尾，省得在几千行里翻
      - name: Show error summary
        if: failure()
        run: |
          echo "########## 关键报错 ##########"
          grep -n -A 15 "What went wrong" build.log || echo "(没找到 What went wrong)"
          echo "########## 所有 e: 报错（Kotlin）##########"
          grep -n "^e: " build.log | head -40 || echo "(无)"
          echo "########## 所有 error: 行 ##########"
          grep -n -i "error:" build.log | head -40 || echo "(无)"
          echo "########## 最后 40 行 ##########"
          tail -40 build.log

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clientmod-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # 无论成功失败都留一份完整日志，方便下载后搜索
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
